<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>猜拳大對抗 - 座標修正版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-image: url('images/bg/bg.webp'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            @apply flex items-center justify-center min-h-screen overflow-hidden;
        }

        /* 💡 核心舞台：這是 NPC 與按鈕的共同基準 */
        .stage-center {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            /* 往下移動 100px */
            margin-top: 100px;
        }
        
        /* 💡 NPC 人物圖片 */
        #npc-image {
            width: 700px;
            height: 700px;
            object-fit: contain;
            z-index: 10;
            filter: drop-shadow(0 20px 30px rgba(0,0,0,0.5));
            transition: all 0.3s ease;
        }

        /* 💡 按鈕通用樣式：強制絕對定位以貼合 NPC 底部 */
        .rps-btn {
            position: absolute; /* 💡 關鍵：脫離文件流，才能精確貼合 */
            z-index: 20;
            width: 80px;
            height: 80px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            border: 3px solid rgba(255, 255, 255, 0.4);
            border-radius: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .rps-btn:active { transform: scale(0.9) !important; }

        /* 💡 座標精確分配：相對於人物底部的左右分佈 */
        /* bottom 控制垂直高度，left 控制水平位置 */
        .btn-scissors { 
            bottom: 50px; 
            left: calc(50% - 220px); /* 往左移 220px */
        }
        
        .btn-rock { 
            bottom: -10px; /* 💡 貼合 NPC 正中心最下方 */
            left: 50%;
            transform: translateX(-50%);
        }
        
        .btn-paper { 
            bottom: 50px; 
            right: calc(50% - 220px); /* 往右移 220px */
        }

        .rps-btn span { font-size: 3rem; }
        .rps-btn p { color: white; font-weight: 900; font-size: 0.6rem; margin: 0; }

        #result-text { 
            position: absolute;
            top: -50px; /* 顯示在人物頭頂上方 */
            font-size: 5rem;
            font-weight: 900;
            font-style: italic;
            color: white;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 30;
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="stage-center">
        <p id="result-text">READY?</p>
        
        <img id="npc-image" src="images/rps/rps_ready.webp" alt="NPC">

        <button onclick="play('s')" class="rps-btn btn-scissors">
            <span>✌️</span>
            <p>剪刀</p>
        </button>
        
        <button onclick="play('r')" class="rps-btn btn-rock">
            <span>✊</span>
            <p>石頭</p>
        </button>
        
        <button onclick="play('p')" class="rps-btn btn-paper">
            <span>🖐️</span>
            <p>布</p>
        </button>
    </div>

    <script>
        const npcImg = document.getElementById('npc-image');
        const resultTxt = document.getElementById('result-text');

        let isPlaying = false;

        async function play(playerChoice) {
            if (isPlaying) return;
            isPlaying = true;

            resultTxt.innerText = "猜...拳...";
            resultTxt.style.color = "white";
            npcImg.src = 'images/rps/rps_ready.webp';
            npcImg.style.transform = "scale(1.1)";

            await new Promise(r => setTimeout(r, 700));

            const options = ['r', 'p', 's'];
            const npcChoice = options[Math.floor(Math.random() * 3)];
            npcImg.src = `images/rps/rps_${npcChoice}.webp`;
            npcImg.style.transform = "scale(1.0)";

            let status = ""; 
            if (playerChoice === npcChoice) {
                status = "draw";
            } else if (
                (playerChoice === 'r' && npcChoice === 's') ||
                (playerChoice === 's' && npcChoice === 'p') ||
                (playerChoice === 'p' && npcChoice === 'r')
            ) {
                status = "win";
            } else {
                status = "lose";
            }

            await new Promise(r => setTimeout(r, 400));
            const randIdx = Math.floor(Math.random() * 2) + 1;

            if (status === "draw") {
                resultTxt.innerText = "DRAW!";
                resultTxt.style.color = "#fbbf24"; 
            } else if (status === "win") {
                resultTxt.innerText = "WIN!";
                resultTxt.style.color = "#4ade80"; 
                npcImg.src = `images/rps/rps_lose${randIdx}.webp`;
            } else {
                resultTxt.innerText = "LOSE!";
                resultTxt.style.color = "#f87171"; 
                npcImg.src = `images/rps/rps_win${randIdx}.webp`;
            }

            await new Promise(r => setTimeout(r, 2000));
            isPlaying = false;
        }
    </script>
</body>
</html>
