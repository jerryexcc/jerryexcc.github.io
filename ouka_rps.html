<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>猜拳大對抗 - 震撼演出版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@900&display=swap" rel="stylesheet">
    <style>
        :root {
            --npc-h: 110vh; /* 💡 翻倍的人物尺寸 */
            --btn-size: 13vh;
            --btn-bottom: 6vh;
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; overscroll-behavior: none; touch-action: none;
        }

        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-image: url('images/bg/bg.webp'); 
            background-size: cover; background-position: center; background-attachment: fixed;
            @apply flex items-center justify-center min-h-screen;
        }

        .stage-center {
            position: relative;
            width: 100vw;
            height: 100dvh;
            margin-top: 15vh; /* 配合超大人物下移 */
        }
        
        #npc-image {
            position: absolute;
            left: 50%;
            top: 40%; 
            transform: translate(-50%, -50%);
            height: var(--npc-h);
            width: auto;
            object-fit: contain;
            z-index: 5; /* 稍微降低層級，讓文字突出 */
            filter: drop-shadow(0 4vh 5vh rgba(0,0,0,0.6));
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .rps-btn {
            position: absolute;
            z-index: 20;
            width: var(--btn-size);
            height: var(--btn-size);
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(10px);
            border: 0.4vh solid rgba(255, 255, 255, 0.5);
            border-radius: 2.5vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: transform 0.1s;
            touch-action: manipulation;
        }

        .rps-btn:active { transform: translate(-50%, 0) scale(0.9) !important; }

        .btn-scissors { bottom: var(--btn-bottom); left: 20%; transform: translateX(-50%); }
        .btn-rock     { bottom: var(--btn-bottom); left: 50%; transform: translateX(-50%); }
        .btn-paper    { bottom: var(--btn-bottom); left: 80%; transform: translateX(-50%); }

        .rps-btn span { font-size: 7vh; line-height: 1; pointer-events: none; }
        .rps-btn p { color: white; font-weight: 900; font-size: 1.8vh; margin-top: 0.5vh; pointer-events: none; }

        #result-text { 
            position: absolute;
            top: 5vh; 
            font-size: 8vh; font-weight: 900; font-style: italic;
            color: white; text-shadow: 0 0.5vh 3vh rgba(0,0,0,0.8);
            z-index: 30; width: 100%; text-align: center; pointer-events: none;
            line-height: 1.2;
        }

        /* 💡 玩家出拳顯示框 */
        #player-choice-overlay {
            @apply absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-40 bg-white/20 backdrop-blur-md border-4 border-white rounded-full w-40 h-40 flex items-center justify-center text-7xl opacity-0 scale-0 transition-all duration-300 pointer-events-none;
        }
        #player-choice-overlay.active { @apply opacity-100 scale-100; }
    </style>
</head>
<body>

    <div class="stage-center">
        <div id="player-choice-overlay">✊</div>

        <p id="result-text">READY?</p>
        <img id="npc-image" src="images/rps/rps_ready.webp" alt="NPC">

        <button onclick="play('s', '✌️')" class="rps-btn btn-scissors">
            <span>✌️</span>
            <p>剪刀</p>
        </button>
        
        <button onclick="play('r', '✊')" class="rps-btn btn-rock">
            <span>✊</span>
            <p>石頭</p>
        </button>
        
        <button onclick="play('p', '🖐️')" class="rps-btn btn-paper">
            <span>🖐️</span>
            <p>布</p>
        </button>
    </div>

    <script>
        const npcImg = document.getElementById('npc-image');
        const resultTxt = document.getElementById('result-text');
        const pOverlay = document.getElementById('player-choice-overlay');

        document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

        let isPlaying = false;

        async function play(playerChoice, emoji) {
            if (isPlaying) return;
            isPlaying = true;

            // 1. 玩家出拳階段
            pOverlay.innerText = emoji;
            pOverlay.classList.add('active');
            resultTxt.innerText = "你出了 " + (playerChoice === 'r' ? '石頭' : playerChoice === 's' ? '剪刀' : '布');
            
            // NPC 進入預備狀態
            npcImg.src = 'images/rps/rps_ready.webp';
            npcImg.style.transform = "translate(-50%, -50%) scale(1.05)";

            // 💡 關鍵：延長 2 秒停頓增加緊張感
            await new Promise(r => setTimeout(r, 2000));
            
            // 2. 揭曉階段
            pOverlay.classList.remove('active');
            resultTxt.innerText = "猜...拳！";

            const options = ['r', 'p', 's'];
            const npcChoice = options[Math.floor(Math.random() * 3)];
            
            // 顯示 NPC 的拳頭
            npcImg.src = `images/rps/rps_${npcChoice}.webp`;
            npcImg.style.transform = "translate(-50%, -50%) scale(1.15)";

            // 3. 判定勝負
            let status = ""; 
            if (playerChoice === npcChoice) {
                status = "draw";
            } else if (
                (playerChoice === 'r' && npcChoice === 's') ||
                (playerChoice === 's' && npcChoice === 'p') ||
                (playerChoice === 'p' && npcChoice === 'r')
            ) {
                status = "win";
            } else {
                status = "lose";
            }

            // 4. 延遲顯示 NPC 的勝負表情
            await new Promise(r => setTimeout(r, 600));
            const randIdx = Math.floor(Math.random() * 5) + 1;

            if (status === "draw") {
                resultTxt.innerText = "DRAW!";
                resultTxt.style.color = "#fbbf24"; 
                npcImg.style.transform = "translate(-50%, -50%) scale(1.0)";
            } else if (status === "win") {
                resultTxt.innerText = "YOU WIN!";
                resultTxt.style.color = "#4ade80"; 
                // 玩家贏了，NPC 顯示輸掉的表情
                npcImg.src = `images/rps/rps_lose${randIdx}.webp`;
                npcImg.style.transform = "translate(-50%, -50%) translateY(20px) scale(0.95)";
            } else {
                resultTxt.innerText = "YOU LOSE!";
                resultTxt.style.color = "#f87171"; 
                // 玩家輸了，NPC 顯示贏了的表情
                npcImg.src = `images/rps/rps_win${randIdx}.webp`;
                npcImg.style.transform = "translate(-50%, -50%) translateY(-20px) scale(1.2)";
            }

            await new Promise(r => setTimeout(r, 2500));
            npcImg.style.transform = "translate(-50%, -50%) scale(1.0)";
            isPlaying = false;
        }
    </script>
</body>
</html>
