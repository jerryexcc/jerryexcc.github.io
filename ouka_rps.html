<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>猜拳大對抗 - 座標鎖定版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-image: url('images/bg/bg.webp'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            @apply flex items-center justify-center min-h-screen overflow-hidden;
        }

        /* 💡 角色總容器：所有座標的基準點 */
        .character-stage {
            @apply relative flex items-center justify-center;
            width: 100vw;
            height: 100dvh;
            /* 往下移動 100px */
            transform: translateY(100px); 
        }
        
        /* 💡 人物：現在放大 2 倍 */
        #npc-image {
            @apply w-[550px] h-[550px] object-contain transition-all duration-300 z-10;
            filter: drop-shadow(0 30px 40px rgba(0,0,0,0.6));
        }

        /* 💡 猜拳圖示通用樣式：貼合人物底部 */
        .rps-btn {
            @apply absolute z-20 transition-all active:scale-90 flex flex-col items-center;
            /* 這裡控制圖示大小 */
            width: 120px;
            height: 120px;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 2rem;
            justify-content: center;
        }

        /* 💡 精確位置分配 */
        .btn-scissors { bottom: 50px; left: calc(50% - 280px); } /* 左下 */
        .btn-rock     { bottom: -20px; left: 50%; transform: translateX(-50%); } /* 正中下 */
        .btn-paper    { bottom: 50px; right: calc(50% - 280px); } /* 右下 */

        .rps-btn span { @apply text-6xl; }
        .rps-btn p { @apply text-white font-black text-sm mt-1; }

        #result-text { 
            @apply absolute text-7xl font-black italic drop-shadow-2xl z-30;
            top: 50px;
            text-align: center;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="character-stage">
        
        <p id="result-text" class="text-white">Ready?</p>
        
        <img id="npc-image" src="images/rps/rps_ready.webp" alt="NPC">

        <button onclick="play('s')" class="rps-btn btn-scissors">
            <span>✌️</span>
            <p>剪刀</p>
        </button>
        
        <button onclick="play('r')" class="rps-btn btn-rock">
            <span>✊</span>
            <p>石頭</p>
        </button>
        
        <button onclick="play('p')" class="rps-btn btn-paper">
            <span>🖐️</span>
            <p>布</p>
        </button>

    </div>

    <script>
        const npcImg = document.getElementById('npc-image');
        const resultTxt = document.getElementById('result-text');

        let isPlaying = false;

        async function play(playerChoice) {
            if (isPlaying) return;
            isPlaying = true;

            resultTxt.innerText = "猜...拳...";
            resultTxt.style.color = "white";
            npcImg.src = 'images/rps/rps_ready.webp';
            // 出拳時微微震動縮放
            npcImg.style.transform = "scale(1.1)"; 

            await new Promise(r => setTimeout(r, 700));

            const options = ['r', 'p', 's'];
            const npcChoice = options[Math.floor(Math.random() * 3)];
            npcImg.src = `images/rps/rps_${npcChoice}.webp`;
            npcImg.style.transform = "scale(1.0)";

            let status = ""; 
            if (playerChoice === npcChoice) {
                status = "draw";
            } else if (
                (playerChoice === 'r' && npcChoice === 's') ||
                (playerChoice === 's' && npcChoice === 'p') ||
                (playerChoice === 'p' && npcChoice === 'r')
            ) {
                status = "win";
            } else {
                status = "lose";
            }

            await new Promise(r => setTimeout(r, 400));
            const randIdx = Math.floor(Math.random() * 2) + 1;

            if (status === "draw") {
                resultTxt.innerText = "DRAW!";
                resultTxt.style.color = "#fbbf24"; 
            } else if (status === "win") {
                resultTxt.innerText = "WIN!";
                resultTxt.style.color = "#4ade80"; 
                npcImg.src = `images/rps/rps_lose${randIdx}.webp`;
            } else {
                resultTxt.innerText = "LOSE!";
                resultTxt.style.color = "#f87171"; 
                npcImg.src = `images/rps/rps_win${randIdx}.webp`;
            }

            await new Promise(r => setTimeout(r, 2000));
            isPlaying = false;
        }
    </script>
</body>
</html>
