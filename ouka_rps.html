<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>猜拳大對抗 - UI 精確版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-image: url('images/bg/bg.webp'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            @apply flex flex-col items-center justify-between min-h-screen overflow-hidden;
        }
        
        /* 💡 人物區域：從中間垂直中心往下推 100px */
        .npc-container {
            @apply relative flex flex-col items-center justify-center flex-grow;
            top: 100px; 
        }
        
        #npc-image {
            @apply w-72 h-72 object-contain transition-all duration-300;
            filter: drop-shadow(0 20px 25px rgba(0,0,0,0.5));
        }

        /* 💡 下方按鈕區：三等分布局並放大 3 倍 */
        .controls-container {
            @apply w-full flex justify-between items-end px-4 pb-12;
            min-height: 200px;
        }

        .rps-btn {
            /* 💡 放大尺寸至約 3 倍 (原本約 60px -> 現在約 180px) */
            @apply bg-black/50 backdrop-blur-md border-4 border-white/40 rounded-3xl transition-all active:scale-95;
            width: 110px; 
            height: 110px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .rps-btn span { @apply text-5xl; } /* 放大 Emoji */
        .rps-btn p { @apply text-white font-black text-xs mt-1; }

        #result-text { 
            @apply absolute text-6xl font-black italic drop-shadow-2xl z-10;
            top: -120px; /* 顯示在人物上方 */
            text-align: center;
            width: 300px;
        }
    </style>
</head>
<body>

    <div class="npc-container">
        <p id="result-text" class="text-white transition-all">Ready?</p>
        <img id="npc-image" src="images/rps/rps_ready.webp" alt="NPC">
    </div>

    <div class="controls-container">
        <button onclick="play('s')" class="rps-btn">
            <span>✌️</span>
            <p>剪刀</p>
        </button>
        
        <button onclick="play('r')" class="rps-btn">
            <span>✊</span>
            <p>石頭</p>
        </button>
        
        <button onclick="play('p')" class="rps-btn">
            <span>🖐️</span>
            <p>布</p>
        </button>
    </div>

    <script>
        const npcImg = document.getElementById('npc-image');
        const resultTxt = document.getElementById('result-text');

        let isPlaying = false;

        async function play(playerChoice) {
            if (isPlaying) return;
            isPlaying = true;

            // 1. 準備階段
            resultTxt.innerText = "猜...拳...";
            resultTxt.style.color = "white";
            npcImg.src = 'images/rps/rps_ready.webp';
            npcImg.style.transform = "scale(1.2) translateY(-20px)"; // 預備時稍微浮起

            await new Promise(r => setTimeout(r, 700));

            // 2. AI 隨機出拳
            const options = ['r', 'p', 's'];
            const npcChoice = options[Math.floor(Math.random() * 3)];
            npcImg.src = `images/rps/rps_${npcChoice}.webp`;
            npcImg.style.transform = "scale(1.0) translateY(0)";

            // 3. 判斷勝負
            let status = ""; 
            if (playerChoice === npcChoice) {
                status = "draw";
            } else if (
                (playerChoice === 'r' && npcChoice === 's') ||
                (playerChoice === 's' && npcChoice === 'p') ||
                (playerChoice === 'p' && npcChoice === 'r')
            ) {
                status = "win";
            } else {
                status = "lose";
            }

            // 4. NPC 勝負反應
            await new Promise(r => setTimeout(r, 400));
            const randIdx = Math.floor(Math.random() * 2) + 1;

            if (status === "draw") {
                resultTxt.innerText = "DRAW!";
                resultTxt.style.color = "#fbbf24"; 
            } else if (status === "win") {
                resultTxt.innerText = "WIN!";
                resultTxt.style.color = "#4ade80"; 
                npcImg.src = `images/rps/rps_lose${randIdx}.webp`;
            } else {
                resultTxt.innerText = "LOSE!";
                resultTxt.style.color = "#f87171"; 
                npcImg.src = `images/rps/rps_win${randIdx}.webp`;
            }

            await new Promise(r => setTimeout(r, 2000));
            isPlaying = false;
        }
    </script>
</body>
</html>
