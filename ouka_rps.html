<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>猜拳大對抗 - 靜態巨大版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 💡 讓 NPC 佔據螢幕 80% 高度，視覺上非常巨大 */
            --npc-h: 80vh; 
            --btn-size: 13vh;
            --btn-bottom: 5vh; /* 按鈕距離底部的固定距離 */
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; overscroll-behavior: none; touch-action: none;
        }

        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-image: url('images/bg/bg.webp'); 
            background-size: cover; background-position: center; background-attachment: fixed;
            @apply flex items-end justify-center min-h-screen; /* 💡 改為對齊底部 */
        }

        .stage-center {
            position: relative;
            width: 100vw;
            height: 100dvh;
            /* 移除 margin-top，避免整體被往下推 */
        }
        
        /* 💡 NPC 樣式：巨大且固定在底部 */
        #npc-image {
            position: absolute;
            left: 50%;
            bottom: 0; /* 💡 鎖定在螢幕底部 */
            transform: translateX(-50%); /* 只做水平置中，不做縮放 */
            height: var(--npc-h);
            width: auto;
            object-fit: contain;
            z-index: 5; /* 在按鈕下方 */
            filter: drop-shadow(0 -2vh 4vh rgba(0,0,0,0.5));
            pointer-events: none;
            /* 移除 transition，確保圖片切換是瞬間且清晰的 */
        }

        /* 💡 按鈕樣式 */
        .rps-btn {
            position: absolute;
            z-index: 20; /* 確保按鈕浮在 NPC 上方 */
            width: var(--btn-size);
            height: var(--btn-size);
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            border: 0.4vh solid rgba(255, 255, 255, 0.6);
            border-radius: 2.5vh;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            /* 移除 transform transition 以配合整體靜態感，或保留輕微點擊回饋 */
            transition: transform 0.1s;
            touch-action: manipulation;
        }

        .rps-btn:active { transform: translateX(-50%) scale(0.95) !important; }

        /* 💡 按鈕位置：絕對定位 */
        .btn-scissors { bottom: var(--btn-bottom); left: 20%; transform: translateX(-50%); }
        .btn-rock     { bottom: var(--btn-bottom); left: 50%; transform: translateX(-50%); }
        .btn-paper    { bottom: var(--btn-bottom); left: 80%; transform: translateX(-50%); }

        .rps-btn span { font-size: 7vh; line-height: 1; pointer-events: none; }
        .rps-btn p { color: white; font-weight: 900; font-size: 1.8vh; margin-top: 0.5vh; pointer-events: none; }

        #result-text { 
            position: absolute;
            top: 8vh; 
            font-size: 8vh; font-weight: 900; font-style: italic;
            color: white; text-shadow: 0 0.5vh 3vh rgba(0,0,0,0.8);
            z-index: 30; width: 100%; text-align: center; pointer-events: none;
            line-height: 1.2;
        }

        /* 玩家出拳顯示框 */
        #player-choice-overlay {
            @apply absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 z-40 bg-white/20 backdrop-blur-md border-4 border-white rounded-full w-48 h-48 flex items-center justify-center text-8xl opacity-0 scale-0 transition-all duration-200 pointer-events-none;
        }
        #player-choice-overlay.active { @apply opacity-100 scale-100; }
    </style>
</head>
<body>

    <div class="stage-center">
        <div id="player-choice-overlay">✊</div>

        <p id="result-text">READY?</p>
        
        <img id="npc-image" src="images/rps/rps_ready.webp" alt="NPC">

        <button onclick="play('s', '✌️')" class="rps-btn btn-scissors">
            <span>✌️</span>
            <p>剪刀</p>
        </button>
        
        <button onclick="play('r', '✊')" class="rps-btn btn-rock">
            <span>✊</span>
            <p>石頭</p>
        </button>
        
        <button onclick="play('p', '🖐️')" class="rps-btn btn-paper">
            <span>🖐️</span>
            <p>布</p>
        </button>
    </div>

    <script>
        const npcImg = document.getElementById('npc-image');
        const resultTxt = document.getElementById('result-text');
        const pOverlay = document.getElementById('player-choice-overlay');

        document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });

        let isPlaying = false;

        async function play(playerChoice, emoji) {
            if (isPlaying) return;
            isPlaying = true;

            // 1. 玩家出拳階段
            pOverlay.innerText = emoji;
            pOverlay.classList.add('active');
            resultTxt.innerText = "你出了 " + (playerChoice === 'r' ? '石頭' : playerChoice === 's' ? '剪刀' : '布');
            
            // NPC 保持 Ready 狀態，不縮放，不位移
            npcImg.src = 'images/rps/rps_ready.webp';

            // 停頓 2 秒
            await new Promise(r => setTimeout(r, 2000));
            
            // 2. NPC 出拳 (無動畫，直接切換圖片)
            pOverlay.classList.remove('active');
            resultTxt.innerText = "猜...拳！";

            const options = ['r', 'p', 's'];
            const npcChoice = options[Math.floor(Math.random() * 3)];
            
            // 💡 直接切換圖片，不做 style.transform
            npcImg.src = `images/rps/rps_${npcChoice}.webp`;

            // 3. 判定勝負
            let status = ""; 
            if (playerChoice === npcChoice) {
                status = "draw";
            } else if (
                (playerChoice === 'r' && npcChoice === 's') ||
                (playerChoice === 's' && npcChoice === 'p') ||
                (playerChoice === 'p' && npcChoice === 'r')
            ) {
                status = "win";
            } else {
                status = "lose";
            }

            // 4. 顯示勝負表情 (無動畫，直接切換圖片)
            await new Promise(r => setTimeout(r, 600)); // 稍微停頓一下讓玩家看清楚 NPC 出什麼拳
            const randIdx = Math.floor(Math.random() * 2) + 1;

            if (status === "draw") {
                resultTxt.innerText = "DRAW!";
                resultTxt.style.color = "#fbbf24"; 
            } else if (status === "win") {
                resultTxt.innerText = "YOU WIN!";
                resultTxt.style.color = "#4ade80"; 
                // NPC 輸了的表情
                npcImg.src = `images/rps/rps_lose${randIdx}.webp`;
            } else {
                resultTxt.innerText = "YOU LOSE!";
                resultTxt.style.color = "#f87171"; 
                // NPC 贏了的表情
                npcImg.src = `images/rps/rps_win${randIdx}.webp`;
            }

            // 5. 結束，回復原狀
            await new Promise(r => setTimeout(r, 2500));
            npcImg.src = 'images/rps/rps_ready.webp'; // 恢復到 Ready 圖片
            isPlaying = false;
        }
    </script>
</body>
</html>
