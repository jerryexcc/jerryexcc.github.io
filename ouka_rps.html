<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>猜拳大對抗</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@900&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            /* 💡 背景圖設定 */
            background-image: url('images/bg/bg.webp'); 
            background-size: cover;
            background-position: center;
            @apply flex flex-col items-center justify-between min-h-screen overflow-hidden;
        }
        
        /* NPC 顯示區 */
        .npc-container {
            @apply mt-20 flex flex-col items-center justify-center;
        }
        
        #npc-image {
            @apply w-64 h-64 object-contain transition-all duration-300;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.3));
        }

        /* 下方控制區 */
        .controls-container {
            @apply w-full bg-black/40 backdrop-blur-md p-6 flex gap-4 justify-around border-t-2 border-white/20;
        }

        .rps-btn {
            @apply flex-1 bg-white/10 hover:bg-white/30 border-2 border-white/50 rounded-2xl p-4 flex flex-col items-center gap-2 transition-all active:scale-90;
        }

        .rps-btn span { @apply text-4xl; }
        .rps-btn p { @apply text-white font-bold text-sm; }

        #result-text { @apply text-4xl font-black text-white italic drop-shadow-md mb-4; }
    </style>
</head>
<body>

    <div class="npc-container">
        <p id="result-text">準備好了嗎？</p>
        <img id="npc-image" src="images/rps/rps_ready.webp" alt="NPC">
        <div id="player-choice-view" class="mt-8 text-white font-bold hidden text-xl">
            你出了：<span id="p-choice-name"></span>
        </div>
    </div>

    <div class="controls-container">
        <button onclick="play('s')" class="rps-btn">
            <span>✌️</span>
            <p>剪刀 (S)</p>
        </button>
        <button onclick="play('r')" class="rps-btn">
            <span>✊</span>
            <p>石頭 (R)</p>
        </button>
        <button onclick="play('p')" class="rps-btn">
            <span>🖐️</span>
            <p>布 (P)</p>
        </button>
    </div>

    <script>
        const npcImg = document.getElementById('npc-image');
        const resultTxt = document.getElementById('result-text');
        const choiceView = document.getElementById('player-choice-view');
        const choiceName = document.getElementById('p-choice-name');

        let isPlaying = false;

        async function play(playerChoice) {
            if (isPlaying) return;
            isPlaying = true;

            // 1. 顯示玩家選擇與預備動畫
            choiceView.classList.remove('hidden');
            const names = { 'r': '石頭', 'p': '布', 's': '剪刀' };
            choiceName.innerText = names[playerChoice];
            
            resultTxt.innerText = "猜...拳...";
            npcImg.src = 'images/rps/rps_ready.webp';
            npcImg.classList.add('scale-110');

            // 💡 模擬思考延遲
            await new Promise(r => setTimeout(r, 800));

            // 2. NPC 隨機出拳
            const options = ['r', 'p', 's'];
            const npcChoice = options[Math.floor(Math.random() * 3)];
            npcImg.src = `images/rps/rps_${npcChoice}.webp`;
            npcImg.classList.remove('scale-110');

            // 3. 判斷輸贏
            // Result: 0 縮, 1 玩家贏, 2 NPC贏
            let status = 0; 
            if (playerChoice === npcChoice) {
                status = 0;
            } else if (
                (playerChoice === 'r' && npcChoice === 's') ||
                (playerChoice === 's' && npcChoice === 'p') ||
                (playerChoice === 'p' && npcChoice === 'r')
            ) {
                status = 1; // 玩家贏 (NPC 輸了)
            } else {
                status = 2; // NPC 贏了
            }

            // 4. 顯示 NPC 的反應圖片 (隨機 win/lose)
            await new Promise(r => setTimeout(r, 500));
            const randIdx = Math.floor(Math.random() * 2) + 1; // 1 or 2

            if (status === 0) {
                resultTxt.innerText = "平手！";
                resultTxt.className = "text-amber-400 italic text-4xl font-black";
            } else if (status === 1) {
                // 玩家贏了，NPC 要顯示 lose 圖片
                resultTxt.innerText = "你贏了！";
                resultTxt.className = "text-green-400 italic text-4xl font-black";
                npcImg.src = `images/rps/rps_lose${randIdx}.webp`;
            } else {
                // NPC 贏了，NPC 要顯示 win 圖片
                resultTxt.innerText = "你輸了...";
                resultTxt.className = "text-red-500 italic text-4xl font-black";
                npcImg.src = `images/rps/rps_win${randIdx}.webp`;
            }

            // 5. 結束冷卻
            await new Promise(r => setTimeout(r, 2000));
            isPlaying = false;
        }
    </script>
</body>
</html>
