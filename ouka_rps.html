<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>猜拳大對抗 - VH 比例版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@900&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 💡 定義核心比例變數 */
            --npc-h: 55vh;
            --btn-size: 13vh;
        }

        body { 
            font-family: 'Noto Sans TC', sans-serif; 
            background-image: url('images/bg/bg.webp'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            margin: 0;
            @apply flex items-center justify-center min-h-screen overflow-hidden;
        }

        /* 💡 舞台容器 */
        .stage-center {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100vw;
            height: 100vh;
            /* 往下移動 10vh */
            margin-top: 10vh;
        }
        
        /* 💡 NPC 人物：高度佔螢幕 55% */
        #npc-image {
            height: var(--npc-h);
            width: auto;
            object-fit: contain;
            z-index: 10;
            filter: drop-shadow(0 2vh 3vh rgba(0,0,0,0.5));
            transition: all 0.3s ease;
        }

        /* 💡 按鈕通用樣式 */
        .rps-btn {
            position: absolute;
            z-index: 20;
            width: var(--btn-size);
            height: var(--btn-size);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border: 0.4vh solid rgba(255, 255, 255, 0.4);
            border-radius: 2.5vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s;
        }

        .rps-btn:active { transform: scale(0.9) !important; }

        /* 💡 使用 vh 鎖定與人物圖片的相對位置 */
        .btn-scissors { 
            bottom: 12vh; /* 從容器底部往上推 */
            left: calc(50% - 22vh); 
        }
        
        .btn-rock { 
            bottom: 2vh; 
            left: 50%;
            transform: translateX(-50%);
        }
        
        .btn-paper { 
            bottom: 12vh; 
            right: calc(50% - 22vh); 
        }

        /* 💡 內容物大小也使用 vh，確保縮放比例 */
        .rps-btn span { font-size: 7vh; line-height: 1; }
        .rps-btn p { color: white; font-weight: 900; font-size: 1.8vh; margin-top: 0.5vh; }

        #result-text { 
            position: absolute;
            top: 2vh; 
            font-size: 10vh;
            font-weight: 900;
            font-style: italic;
            color: white;
            text-shadow: 0 0.5vh 2vh rgba(0,0,0,0.6);
            z-index: 30;
            width: 100%;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="stage-center">
        <p id="result-text">READY?</p>
        
        <img id="npc-image" src="images/rps/rps_ready.webp" alt="NPC">

        <button onclick="play('s')" class="rps-btn btn-scissors">
            <span>✌️</span>
            <p>剪刀</p>
        </button>
        
        <button onclick="play('r')" class="rps-btn btn-rock">
            <span>✊</span>
            <p>石頭</p>
        </button>
        
        <button onclick="play('p')" class="rps-btn btn-paper">
            <span>🖐️</span>
            <p>布</p>
        </button>
    </div>

    <script>
        const npcImg = document.getElementById('npc-image');
        const resultTxt = document.getElementById('result-text');

        let isPlaying = false;

        async function play(playerChoice) {
            if (isPlaying) return;
            isPlaying = true;

            // 1. 預備動作
            resultTxt.innerText = "猜...拳...";
            resultTxt.style.color = "white";
            npcImg.src = 'images/rps/rps_ready.webp';
            npcImg.style.transform = "scale(1.1)";

            await new Promise(r => setTimeout(r, 700));

            // 2. 隨機出拳
            const options = ['r', 'p', 's'];
            const npcChoice = options[Math.floor(Math.random() * 3)];
            npcImg.src = `images/rps/rps_${npcChoice}.webp`;
            npcImg.style.transform = "scale(1.0)";

            // 3. 邏輯判斷
            let status = ""; 
            if (playerChoice === npcChoice) {
                status = "draw";
            } else if (
                (playerChoice === 'r' && npcChoice === 's') ||
                (playerChoice === 's' && npcChoice === 'p') ||
                (playerChoice === 'p' && npcChoice === 'r')
            ) {
                status = "win";
            } else {
                status = "lose";
            }

            // 4. 勝負圖片切換
            await new Promise(r => setTimeout(r, 400));
            const randIdx = Math.floor(Math.random() * 2) + 1;

            if (status === "draw") {
                resultTxt.innerText = "DRAW!";
                resultTxt.style.color = "#fbbf24"; 
            } else if (status === "win") {
                resultTxt.innerText = "WIN!";
                resultTxt.style.color = "#4ade80"; 
                npcImg.src = `images/rps/rps_lose${randIdx}.webp`;
            } else {
                resultTxt.innerText = "LOSE!";
                resultTxt.style.color = "#f87171"; 
                npcImg.src = `images/rps/rps_win${randIdx}.webp`;
            }

            await new Promise(r => setTimeout(r, 2000));
            isPlaying = false;
        }
    </script>
</body>
</html>
