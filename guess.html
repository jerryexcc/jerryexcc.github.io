<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
    <title>謳歌戰記 - 終極密碼</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;900&display=swap');

        html, body {
            height: 100%;
            height: -webkit-fill-available;
            overflow: hidden;
            background-color: #000;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif
        }

        .bg-scene {
            background-image: url('https://jerryexcc.github.io/images/bg/bg.webp');
            background-size: cover;
            background-position: center;
        }

        .character-img {
            filter: drop-shadow(0 0 10px rgba(0, 0, 0, 0.5));
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .character-thinking {
            filter: drop-shadow(0 0 20px rgba(255, 215, 0, 0.8)) brightness(1.2);
            transform: scale(1.05);
        }

        /* 防止 iOS 點擊輸入框時畫面縮放 */
        input {
            font-size: 16px !important;
        }

        @media (min-width: 640px) {
            input {
                font-size: 1.5rem !important;
            }
        }

        .fade-enter-active, .fade-leave-active { transition: opacity 0.4s }
        .fade-enter-from, .fade-leave-to { opacity: 0 }
    </style>
</head>

<body class="bg-black">

    <div id="app" class="relative w-screen h-full bg-scene flex flex-col items-center justify-between p-4 sm:p-6">

        <div class="z-20 w-full max-w-md bg-black/60 backdrop-blur-lg rounded-2xl border border-white/20 p-4 sm:p-5 shadow-2xl text-center">
            <h1 class="text-yellow-400 font-black text-lg sm:text-xl tracking-widest mb-2 uppercase">Ultimate Code</h1>
            <div class="flex justify-between items-center px-4">
                <div class="text-center">
                    <span class="block text-[10px] text-blue-300 uppercase font-bold">Min</span>
                    <span class="text-2xl sm:text-3xl font-black text-blue-400">{{ min }}</span>
                </div>
                <div class="text-white/20 text-xl font-light italic">vs</div>
                <div class="text-center">
                    <span class="block text-[10px] text-red-300 uppercase font-bold">Max</span>
                    <span class="text-2xl sm:text-3xl font-black text-red-400">{{ max }}</span>
                </div>
            </div>
        </div>

        <div class="relative flex-1 w-full min-h-0 flex items-center justify-center">
            <img src="https://jerryexcc.github.io/images/rps/rps_ready.webp"
                class="character-img h-full max-h-[45vh] sm:max-h-[55vh] object-contain"
                :class="{ 'character-thinking': isLLMTurn }">

            <transition name="fade">
                <div v-if="message"
                    class="absolute top-[10%] sm:top-1/4 bg-white/95 text-black px-5 py-2 rounded-full font-bold shadow-2xl border-2 border-gray-100 text-sm sm:text-base whitespace-nowrap z-30">
                    {{ message }}
                    <div class="absolute top-full left-1/2 -translate-x-1/2 border-8 border-transparent border-t-white/95"></div>
                </div>
            </transition>
        </div>

        <div class="z-20 w-full max-w-md bg-gradient-to-t from-black via-black/80 to-transparent p-4 sm:p-6 pb-8 sm:pb-10 rounded-t-3xl">
           
            <div v-if="!gameOver">
                <p class="text-center text-[10px] sm:text-xs text-white/40 mb-3 tracking-[0.2em] font-medium uppercase">
                    {{ isLLMTurn ? 'Oka is analyzing...' : 'It\'s your turn to guess' }}
                </p>
                <div class="flex gap-3">
                    <input v-model.number="userGuess"
                        type="number"
                        inputmode="numeric"
                        pattern="[0-9]*"
                        @keyup.enter="handleUserAction"
                        :disabled="isLLMTurn"
                        class="flex-1 min-w-0 bg-white/10 border border-white/20 rounded-2xl px-4 py-3 sm:py-4 text-white text-2xl font-black text-center outline-none focus:border-yellow-500 transition-all placeholder:text-white/10"
                        placeholder="---">
                   
                    <button @click="handleUserAction" :disabled="isLLMTurn || !userGuess"
                        class="bg-yellow-500 hover:bg-yellow-400 disabled:bg-gray-700 disabled:text-white/30 text-black font-black px-6 sm:px-8 py-3 sm:py-4 rounded-2xl shadow-lg active:scale-95 transition-all whitespace-nowrap">
                        GO
                    </button>
                </div>
            </div>

            <div v-else class="text-center py-4">
                <h2 class="text-4xl sm:text-5xl font-black mb-3 italic tracking-tighter"
                    :class="winner === 'User' ? 'text-green-400' : 'text-pink-500'">
                    {{ winner === 'User' ? 'VICTORY!' : 'DEFEATED' }}
                </h2>
                <div class="inline-block bg-yellow-500/10 border border-yellow-500/20 px-4 py-1 rounded-full mb-4">
                   <span class="text-yellow-400 text-xs font-bold tracking-widest uppercase">Target Code: {{ targetNumber }}</span>
                </div>
                <p class="text-white/70 text-sm sm:text-base mb-6 px-2 italic leading-relaxed">" {{ endMsg }} "</p>
                <button @click="resetGame"
                    class="w-full bg-white text-black py-4 rounded-2xl font-black hover:bg-gray-200 active:scale-[0.98] transition-all shadow-xl">
                    再陪我玩一次嘛❤️
                </button>
            </div>
        </div>

    </div>

    <script>
        const { createApp, ref, onMounted } = Vue

        const GAS_URL = 'https://script.google.com/macros/s/AKfycbx6U-N8GTDGJTTKqNkcL6zezRh-3UruRWE7RfqpLLm9I4P05A-BZ8Il0UQcyImCcMd2dA/exec'

        createApp({
            setup() {
                const targetNumber = ref(0)
                const min = ref(1)
                const max = ref(1000)
                const userGuess = ref(null)
                const isLLMTurn = ref(false)
                const message = ref("我是謳歌，由你開局。")
                const gameOver = ref(false)
                const winner = ref(null)
                const endMsg = ref("")

                const initGame = () => {
                    targetNumber.value = Math.floor(Math.random() * 1000) + 1
                    min.value = 1
                    max.value = 1000
                    gameOver.value = false
                    winner.value = null
                    isLLMTurn.value = false
                    userGuess.value = null
                    message.value = "由你先行，請猜一個數字。"
                }

                const judge = (guess, player) => {
                    if (guess === targetNumber.value) {
                        gameOver.value = true
                        winner.value = player
                        if (player === 'User') {
                            message.value = "竟然被你猜中了...❤️"
                            endMsg.value = "恭喜你！答案確實是 " + targetNumber.value + "，你是這場遊戲的贏家唷♪"
                        } else {
                            message.value = "啊哈哈～我贏了唷！♪"
                            endMsg.value = "真可惜～謳歌精準地抓到了 " + targetNumber.value + " 呢！小笨蛋輸了唷❤️"
                        }
                        return true
                    }

                    if (guess < targetNumber.value) {
                        min.value = Math.max(min.value, guess)
                        message.value = player === 'User' ? "太小了唷，加油❤️" : `謳歌猜了 ${guess}，太小。`
                    } else {
                        max.value = Math.min(max.value, guess)
                        message.value = player === 'User' ? "哎呀～太大了啦✨" : `謳歌猜了 ${guess}，太大。`
                    }
                    return false
                }

                const handleUserAction = async () => {
                    const val = userGuess.value
                    if (!val || val <= min.value || val >= max.value) {
                        message.value = `請輸入 ${min.value} ~ ${max.value}`
                        return
                    }

                    const hit = judge(val, 'User')
                    userGuess.value = null

                    if (!hit) {
                        isLLMTurn.value = true
                        await askOkaAssistant()
                    }
                }

                const askOkaAssistant = async () => {
                    try {
                        const response = await fetch(GAS_URL, {
                            method: 'POST',
                            body: JSON.stringify({
                                action: "ultimate_number",
                                min: min.value,
                                max: max.value
                            })
                        })
                        const data = await response.json()

                        if (data && data.aiGuess !== undefined) {
                            setTimeout(() => {
                                const isOkaWin = judge(parseInt(data.aiGuess), 'LLM')
                                if (!isOkaWin && data.aiMessage) {
                                    message.value = data.aiMessage
                                }
                                isLLMTurn.value = false
                            }, 1500)
                        } else {
                            throw new Error('Data format error')
                        }
                    } catch (e) {
                        console.error('GAS Error:', e)
                        const fallback = Math.floor((min.value + max.value) / 2)
                        judge(fallback, 'LLM')
                        isLLMTurn.value = false
                    }
                }

                onMounted(initGame)

                return {
                    min, max, userGuess, isLLMTurn, message, gameOver, winner, endMsg, targetNumber,
                    handleUserAction, resetGame: initGame
                }
            }
        }).mount('#app')
    </script>
</body>

</html>
