<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>黑洞引力迷宮 Demo</title>
    <style>
        body {
            margin: 0;
            background: #0f172a;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            font-family: system-ui, sans-serif;
            color: white;
        }

        canvas {
            background: #020617;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .6);
        }
    </style>
</head>

<body>
    <canvas id="game" width="420" height="420"></canvas>

    <script>
        /* =========================
           基本設定
        ========================= */
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        const ROWS = 9;
        const COLS = 9;
        const currentCellSize = canvas.width / COLS;

        /* =========================
           球體
        ========================= */
        const ball = {
            x: currentCellSize * 0.5,
            y: currentCellSize * 0.5,
            vx: 0,
            vy: 0,
            r: currentCellSize * 0.18
        };

        /* =========================
           主路徑（簡化版）
           S → E 固定一條可走路
        ========================= */
        const mainPath = [];
        for (let i = 0; i < COLS; i++) {
            mainPath.push({ r: 4, c: i });
        }

        /* =========================
           黑洞
        ========================= */
        let blackHoles = [];

        function spawnBlackHoleOnMainPath(mainPath) {
            const start = Math.floor(mainPath.length * 0.3);
            const end = Math.floor(mainPath.length * 0.8);

            const node =
                mainPath[start + Math.floor(Math.random() * (end - start))];

            blackHoles.push({
                row: node.r,
                col: node.c,
                radiusRatio: 0.28,
                bias: {
                    x: Math.sign(Math.random() - 0.5),
                    y: Math.sign(Math.random() - 0.5)
                }
            });
        }

        function setupLevel() {
            blackHoles = [];
            for (let i = 0; i < 3; i++) {
                spawnBlackHoleOnMainPath(mainPath);
            }
        }
        setupLevel();

        /* =========================
           操作（滑鼠 / 觸控）
        ========================= */
        let dragging = false;
        let last = null;

        canvas.addEventListener("pointerdown", e => {
            dragging = true;
            last = { x: e.offsetX, y: e.offsetY };
        });
        canvas.addEventListener("pointerup", () => dragging = false);
        canvas.addEventListener("pointermove", e => {
            if (!dragging) return;
            ball.vx += (e.offsetX - last.x) * 0.02;
            ball.vy += (e.offsetY - last.y) * 0.02;
            last = { x: e.offsetX, y: e.offsetY };
        });

        /* =========================
           黑洞引力
        ========================= */
        function applyBlackHoleGravity(ball) {
            for (const h of blackHoles) {
                const hx = (h.col + 0.5) * currentCellSize;
                const hy = (h.row + 0.5) * currentCellSize;

                const dx = hx - ball.x;
                const dy = hy - ball.y;
                const dist = Math.hypot(dx, dy);

                const radius = currentCellSize * h.radiusRatio * 3;
                if (dist > radius || dist === 0) continue;

                const pull = (1 - dist / radius) * 0.05;

                ball.vx += (dx + h.bias.x * currentCellSize * 0.4) * pull;
                ball.vy += (dy + h.bias.y * currentCellSize * 0.4) * pull;
            }
        }

        /* =========================
           更新
        ========================= */
        function update() {
            applyBlackHoleGravity(ball);

            ball.x += ball.vx;
            ball.y += ball.vy;

            ball.vx *= 0.985;
            ball.vy *= 0.985;

            // 邊界
            ball.x = Math.max(ball.r, Math.min(canvas.width - ball.r, ball.x));
            ball.y = Math.max(ball.r, Math.min(canvas.height - ball.r, ball.y));
        }

        /* =========================
           繪製
        ========================= */
        function drawGrid() {
            ctx.strokeStyle = "#1e293b";
            for (let i = 0; i <= ROWS; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * currentCellSize);
                ctx.lineTo(canvas.width, i * currentCellSize);
                ctx.stroke();
            }
            for (let i = 0; i <= COLS; i++) {
                ctx.beginPath();
                ctx.moveTo(i * currentCellSize, 0);
                ctx.lineTo(i * currentCellSize, canvas.height);
                ctx.stroke();
            }
        }

        function drawMainPath() {
            ctx.fillStyle = "#1e40af";
            for (const p of mainPath) {
                ctx.fillRect(
                    p.c * currentCellSize,
                    p.r * currentCellSize,
                    currentCellSize,
                    currentCellSize
                );
            }
        }

        function drawBlackHoles() {
            for (const h of blackHoles) {
                const x = (h.col + 0.5) * currentCellSize;
                const y = (h.row + 0.5) * currentCellSize;

                ctx.beginPath();
                ctx.arc(x, y, currentCellSize * 0.25, 0, Math.PI * 2);
                ctx.fillStyle = "#000";
                ctx.fill();

                ctx.strokeStyle = "#7c3aed";
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        function drawBall() {
            ctx.beginPath();
            ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
            ctx.fillStyle = "#22d3ee";
            ctx.fill();
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            drawGrid();
            drawMainPath();
            drawBlackHoles();
            drawBall();
        }

        /* =========================
           主迴圈
        ========================= */
        function loop() {
            update();
            render();
            requestAnimationFrame(loop);
        }
        loop();
    </script>
</body>

</html>
