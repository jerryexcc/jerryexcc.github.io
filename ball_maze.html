<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>彈珠迷宮：全螢幕響應版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f1f5f9; @apply flex flex-col items-center justify-center min-h-screen overflow-hidden; }
        /* 💡 容器現在會撐滿可用空間，但保有內距 */
        .canvas-container { 
            @apply relative flex items-center justify-center bg-slate-200/50 rounded-3xl p-4 border-2 border-dashed border-slate-300; 
            width: 90vw; 
            height: 90vw; 
            max-width: 500px; 
            max-height: 500px;
        }
        canvas { @apply border-4 border-slate-700 bg-white shadow-2xl rounded-2xl; touch-action: none; }
        .btn-primary { @apply bg-indigo-600 text-white py-4 px-10 rounded-2xl font-black text-xl shadow-lg active:scale-95 transition-all; }
        .game-info-card { @apply bg-white/80 backdrop-blur-sm px-4 py-2 rounded-xl shadow-sm border border-slate-200 flex flex-col items-center min-w-[80px]; }
    </style>
</head>
<body>

    <div class="flex gap-4 mb-6 w-full max-w-sm justify-center">
        <div class="game-info-card">
            <span class="text-[10px] text-slate-400 font-bold uppercase">Level</span>
            <span id="level-display" class="text-xl font-black text-indigo-600">1</span>
        </div>
        <div class="game-info-card">
            <span class="text-[10px] text-slate-400 font-bold uppercase">Time</span>
            <span id="timer-display" class="text-xl font-black text-slate-700">00:00</span>
        </div>
    </div>
    
    <div class="canvas-container" id="container">
        <canvas id="mazeCanvas"></canvas>
        <div id="permission-overlay" class="absolute inset-0 bg-slate-900/95 flex flex-col items-center justify-center rounded-3xl z-20 transition-all duration-500">
            <div class="text-5xl mb-4">🌀</div>
            <h2 class="text-2xl font-black text-white mb-2">彈珠迷宮：響應式挑戰</h2>
            <p class="text-slate-400 mb-8 text-center text-sm px-10 leading-relaxed">
                畫面隨螢幕自動縮放<br><b class="text-white">引力場優化</b> 考驗操作！
            </p>
            <button onclick="startGame(false)" class="btn-primary">開始挑戰</button>
            <button onclick="startGame(true)" class="bg-amber-500 text-white py-2 px-6 rounded-xl font-bold text-sm shadow-md mt-4">測試模式</button>
        </div>
    </div>

    <div class="mt-8">
        <button id="reset-btn" onclick="resetCurrentLevel()" class="text-slate-400 font-bold text-sm hover:text-slate-600 hidden">🔄 重置本關</button>
    </div>

    <script>
        const canvas = document.getElementById('mazeCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('container');
        const overlay = document.getElementById('permission-overlay');
        const levelText = document.getElementById('level-display');
        const timerText = document.getElementById('timer-display');

        let level = 1, isTestMode = false;
        let startTime, timerInterval, animationId, isGameOver = true;
        let mazeCols, mazeRows, currentCellSize;
        
        const ball = { x: 0, y: 0, vx: 0, vy: 0, radius: 0, isJumping: false };
        const gravity = { x: 0, y: 0 };
        let maze = [], blackHoles = [], potholes = [];

        async function startGame(testMode) {
            isTestMode = testMode;
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission === 'granted') {
                        window.addEventListener('deviceorientation', handleOrientation);
                        window.addEventListener('devicemotion', handleMotion);
                    }
                } catch (e) { console.error(e); }
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
                window.addEventListener('devicemotion', handleMotion);
            }
            overlay.classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('reset-btn').classList.remove('hidden');
            initLevel(1);
        }

        function handleOrientation(event) {
            gravity.y = (event.beta || 0) * 0.12;
            gravity.x = (event.gamma || 0) * 0.12;
        }

        function handleMotion(event) {
            const z = event.acceleration?.z || 0;
            if (Math.abs(z) > 18 && !ball.isJumping) triggerJump();
        }

        function triggerJump() {
            ball.isJumping = true;
            ball.vx *= 2.5; ball.vy *= 2.5;
            if (window.navigator.vibrate) window.navigator.vibrate(50);
            setTimeout(() => ball.isJumping = false, 600);
        }

        // 💡 核心修正：根據容器大小動態計算格子尺寸
        function updateLayout() {
            if (isGameOver) return;
            
            // 獲取容器內部的寬度 (扣除 Padding)
            const padding = 32; 
            const availableSize = Math.min(container.clientWidth - padding, container.clientHeight - padding);
            
            // 根據格子數決定每個格子的寬度
            currentCellSize = Math.floor(availableSize / mazeCols);
            
            // 同步更新畫布尺寸
            canvas.width = mazeCols * currentCellSize;
            canvas.height = mazeRows * currentCellSize;
            
            // 彈珠半徑也隨之縮放
            ball.radius = currentCellSize * 0.25;
        }

        function initLevel(targetLevel) {
            isGameOver = true; cancelAnimationFrame(animationId); clearInterval(timerInterval);
            level = targetLevel;
            levelText.innerText = level;

            // 隨關卡增加格數
            mazeCols = Math.min(6 + Math.floor((level - 1) / 1.5), 15);
            mazeRows = mazeCols;

            // 先計算一次版面
            isGameOver = false; // 暫時開啟以執行 updateLayout
            updateLayout();

            generateMazeDFS();
            
            blackHoles = []; potholes = [];
            if (isTestMode || level >= 5) {
                const pCount = isTestMode ? 3 : 1 + Math.floor((level - 5) / 2);
                for(let i=0; i<pCount; i++) spawnTrap(potholes);
            }
            if (isTestMode || level >= 10) {
                const bCount = isTestMode ? 2 : 1 + Math.floor((level - 10) / 2);
                for(let i=0; i<bCount; i++) spawnTrap(blackHoles);
            }

            resetBall();
            startTimer();
            animationId = requestAnimationFrame(gameLoop);
        }

        function spawnTrap(array) {
            let r, c;
            do {
                r = Math.floor(Math.random() * mazeRows);
                c = Math.floor(Math.random() * mazeCols);
            } while ((r === 0 && c === 0) || (r === mazeRows - 1 && c === mazeCols - 1));
            // 存儲的是「網格座標」，繪製時再乘上 currentCellSize
            array.push({ row: r, col: c, radiusRatio: 0.4 });
        }

        function resetBall() {
            ball.x = currentCellSize / 2; ball.y = currentCellSize / 2;
            ball.vx = 0; ball.vy = 0; ball.isJumping = false;
        }

        function generateMazeDFS() {
            maze = Array(mazeRows).fill(null).map(() => Array(mazeCols).fill(null).map(() => ({ visited: false, walls: { top: true, right: true, bottom: true, left: true } })));
            const stack = []; let current = { col: 0, row: 0 }; maze[0][0].visited = true; stack.push(current);
            while (stack.length > 0) {
                const neighbors = [{ c: current.col, r: current.row - 1, w: 'top', o: 'bottom' },{ c: current.col + 1, r: current.row, w: 'right', o: 'left' },{ c: current.col, r: current.row + 1, w: 'bottom', o: 'top' },{ c: current.col - 1, r: current.row, w: 'left', o: 'right' }]
                .filter(n => n.c >= 0 && n.c < mazeCols && n.r >= 0 && n.r < mazeRows && !maze[n.r][n.c].visited);
                if (neighbors.length > 0) {
                    const next = neighbors[Math.floor(Math.random() * neighbors.length)];
                    maze[current.row][current.col].walls[next.w] = false; maze[next.r][next.c].walls[next.o] = false; maze[next.r][next.c].visited = true;
                    stack.push(current); current = { col: next.c, row: next.r };
                } else { current = stack.pop(); }
            }
        }

        function checkPhysics() {
            const r = Math.floor(ball.y / currentCellSize);
            const c = Math.floor(ball.x / currentCellSize);
            if (r < 0 || r >= mazeRows || c < 0 || c >= mazeCols) return;

            const cell = maze[r][c];
            const t = r * currentCellSize + ball.radius; const b = (r + 1) * currentCellSize - ball.radius;
            const l = c * currentCellSize + ball.radius; const ri = (c + 1) * currentCellSize - ball.radius;

            if (cell.walls.top && ball.y < t) { ball.y = t; ball.vy *= -0.3; }
            if (cell.walls.bottom && ball.y > b) { ball.y = b; ball.vy *= -0.3; }
            if (cell.walls.left && ball.x < l) { ball.x = l; ball.vx *= -0.3; }
            if (cell.walls.right && ball.x > ri) { ball.x = ri; ball.vx *= -0.3; }

            let currentFriction = 0.97;

            // 凹槽
            potholes.forEach(p => {
                const px = (p.col + 0.5) * currentCellSize;
                const py = (p.row + 0.5) * currentCellSize;
                const pr = p.radiusRatio * currentCellSize;
                const dist = Math.hypot(ball.x - px, ball.y - py);
                if (dist < pr) {
                    if (!ball.isJumping) {
                        currentFriction = 0.70;
                        const force = (1 - dist / pr) * 0.15;
                        ball.vx += (px - ball.x) * force;
                        ball.vy += (py - ball.y) * force;
                    }
                }
            });

            // 黑洞
            blackHoles.forEach(h => {
                const hx = (h.col + 0.5) * currentCellSize;
                const hy = (h.row + 0.5) * currentCellSize;
                const hr = h.radiusRatio * currentCellSize;
                const dist = Math.hypot(ball.x - hx, ball.y - hy);
                if (dist < hr * 1.5) {
                    const gravityPull = Math.pow(1 - dist / (hr * 1.5), 2) * 0.4;
                    ball.vx += (hx - ball.x) * gravityPull;
                    ball.vy += (hy - ball.y) * gravityPull;
                    if (dist < hr * 0.4 && !ball.isJumping) {
                        if (window.navigator.vibrate) window.navigator.vibrate([100, 50, 100]);
                        resetBall();
                    }
                }
            });

            ball.vx *= currentFriction; ball.vy *= currentFriction;
        }

        function gameLoop() {
            if (isGameOver) return;
            ball.vx += gravity.x * 0.15; ball.vy += gravity.y * 0.15;
            ball.x += ball.vx; ball.y += ball.vy;
            checkPhysics();

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 終點
            ctx.fillStyle = '#fee2e2'; ctx.fillRect((mazeCols-1)*currentCellSize, (mazeRows-1)*currentCellSize, currentCellSize, currentCellSize);
            ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.arc((mazeCols-0.5)*currentCellSize, (mazeRows-0.5)*currentCellSize, currentCellSize*0.15, 0, Math.PI*2); ctx.fill();

            // 陷阱
            potholes.forEach(p => {
                ctx.beginPath(); ctx.arc((p.col + 0.5) * currentCellSize, (p.row + 0.5) * currentCellSize, p.radiusRatio * currentCellSize, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(203, 213, 225, 0.6)'; ctx.fill();
            });
            blackHoles.forEach(h => {
                const hx = (h.col + 0.5) * currentCellSize, hy = (h.row + 0.5) * currentCellSize, hr = h.radiusRatio * currentCellSize;
                const grad = ctx.createRadialGradient(hx, hy, 0, hx, hy, hr * 1.5);
                grad.addColorStop(0, 'rgba(0,0,0,0.8)'); grad.addColorStop(1, 'transparent');
                ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(hx, hy, hr * 1.5, 0, Math.PI*2); ctx.fill();
            });

            // 牆壁
            ctx.strokeStyle = '#1e293b'; ctx.lineWidth = Math.max(2, currentCellSize * 0.1); ctx.lineCap = 'round';
            for (let r = 0; r < mazeRows; r++) {
                for (let c = 0; c < mazeCols; c++) {
                    const x = c * currentCellSize, y = r * currentCellSize, w = maze[r][c].walls;
                    ctx.beginPath();
                    if (w.top) { ctx.moveTo(x, y); ctx.lineTo(x + currentCellSize, y); }
                    if (w.right) { ctx.moveTo(x + currentCellSize, y); ctx.lineTo(x + currentCellSize, y + currentCellSize); }
                    if (w.bottom) { ctx.moveTo(x, y + currentCellSize); ctx.lineTo(x + currentCellSize, y + currentCellSize); }
                    if (w.left) { ctx.moveTo(x, y); ctx.lineTo(x, y + currentCellSize); }
                    ctx.stroke();
                }
            }

            // 彈珠
            const displayRadius = ball.isJumping ? ball.radius * 1.4 : ball.radius;
            ctx.save();
            if (ball.isJumping) { ctx.shadowBlur = 12; ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowOffsetY = 8; }
            ctx.beginPath(); ctx.arc(ball.x, ball.y, displayRadius, 0, Math.PI * 2);
            const ballGrad = ctx.createRadialGradient(ball.x-2, ball.y-2, 1, ball.x, ball.y, displayRadius);
            ballGrad.addColorStop(0, '#a5b4fc'); ballGrad.addColorStop(1, '#4f46e5');
            ctx.fillStyle = ballGrad; ctx.fill();
            ctx.restore();

            const dist = Math.hypot(ball.x - (mazeCols-0.5)*currentCellSize, ball.y - (mazeRows-0.5)*currentCellSize);
            if (dist < ball.radius + 5) {
                isGameOver = true; clearInterval(timerInterval);
                Swal.fire({ title: `Level ${level} 突破!`, icon: 'success', confirmButtonText: '下一關' }).then(() => initLevel(level + 1));
                return;
            }
            animationId = requestAnimationFrame(gameLoop);
        }

        function startTimer() {
            startTime = Date.now();
            timerInterval = setInterval(() => {
                const elapsed = Math.floor((Date.now() - startTime) / 1000);
                const m = Math.floor(elapsed / 60).toString().padStart(2, '0');
                const s = (elapsed % 60).toString().padStart(2, '0');
                timerText.innerText = `${m}:${s}`;
            }, 1000);
        }

        function resetCurrentLevel() { initLevel(level); }

        // 監聽視窗縮放
        window.addEventListener('resize', () => {
            if (!isGameOver) {
                // 紀錄當前彈珠在格內的相對比例，防止縮放後卡在牆裡
                const colRatio = ball.x / (mazeCols * currentCellSize);
                const rowRatio = ball.y / (mazeRows * currentCellSize);
                
                updateLayout();
                
                ball.x = colRatio * (mazeCols * currentCellSize);
                ball.y = rowRatio * (mazeRows * currentCellSize);
            }
        });

        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowUp') gravity.y = -10;
            if (e.key === 'ArrowDown') gravity.y = 10;
            if (e.key === 'ArrowLeft') gravity.x = -10;
            if (e.key === 'ArrowRight') gravity.x = 10;
            if (e.key === ' ') triggerJump();
        });
        window.addEventListener('keyup', () => { gravity.x = 0; gravity.y = 0; });
    </script>
</body>
</html>
